name: tripsplit

services:
  # Primary development environment.
  #
  # The source tree is bind-mounted so edits on the host are instantly visible
  # inside the container. Dependency caches are kept in named volumes so that
  # rebuilding the image does not re-download the pub/Gradle caches.
  #
  # No ports are exposed: the MVP has no backend, and the Android emulator /
  # physical device runs on the host.
  trip_split_dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: tripsplit-dev:latest
    container_name: trip_split_dev
    working_dir: /workspace
    env_file:
      - docker/config/env.list
    volumes:
      - .:/workspace
      # Tool-generated state is shadowed by volumes instead of the bind mount,
      # so host and container never overwrite each other's package-resolution
      # or build files (`.dart_tool`, pub cache, Gradle cache, build output).
      - trip_split_dart_tool:/workspace/.dart_tool
      - trip_split_pub_cache:/root/.pub-cache
      - trip_split_gradle:/root/.gradle
      - trip_split_build:/workspace/build
      # The Android SDK volume overlays the SDK baked into the image so that
      # components installed at runtime persist across rebuilds. It is
      # initialized from the image contents on first use.
      - trip_split_android:/opt/android-sdk-linux
    stop_grace_period: 5s
    stdin_open: true
    tty: true

volumes:
  trip_split_dart_tool:
  trip_split_pub_cache:
  trip_split_gradle:
  trip_split_build:
  trip_split_android: