name: tripsplit
description: "TripSplit — offline-first expense sharing for trips."
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.3

  # Navigation
  go_router: ^18.0.1

  # Local database (offline-first source of truth)
  drift: ^2.35.0
  sqlite3: ^3.5.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path: ^1.9.1
  path_provider: ^2.1.6

  # Code generation annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Local preferences
  shared_preferences: ^2.5.5

  # Hosted payment checkout (Razorpay). The plugin only ever sees the public
  # key id, the order id, the amount, and the currency; it never learns the
  # key secret, which lives only on the funding server.
  razorpay_flutter: ^1.4.6
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.15.1
  drift_dev: ^2.35.0
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.14.1

  # Linting
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logo/